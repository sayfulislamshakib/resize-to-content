<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Resize To Content</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-primary: #2c2c2c;
      --bg-secondary: #383838;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
      --text-tertiary: #7f7f7f;
      --mode-accent: #0c8ce9;
      --mode-accent-hover: #0d99ff;
      --mode-accent-active: #0a78c8;
      --mode-border: #444444;
      --mode-edge: #555555;
      --font-sans: "Inter", "Roboto Flex", "Google Sans", "Segoe UI", Arial, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      margin: 0;
      padding: 16px;
      display: grid;
      gap: 12px;
      color: var(--text-primary);
      background: var(--bg-primary);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    input,
    button {
      font-family: inherit;
    }

    input {
      user-select: text;
    }

    .mode-section {
      display: grid;
      gap: 8px;
    }

    .mode-title {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(7, 32px);
      gap: 6px;
    }

    .mode-card {
      display: block;
      position: relative;
      cursor: pointer;
      width: 32px;
      height: 32px;
    }

    .mode-card input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mode-card span {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .mode-card span::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid transparent;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: border-color 120ms ease, background-color 120ms ease, opacity 120ms ease;
    }

    .mode-card:hover span::before {
      opacity: 1;
      border-color: var(--mode-border);
      background: rgba(255, 255, 255, 0.04);
    }

    .mode-card input:checked + span::before {
      opacity: 1;
      border-color: var(--mode-accent);
      background: rgba(12, 140, 233, 0.14);
    }

    .mode-card input:focus-visible + span::before {
      opacity: 1;
      border-color: var(--mode-accent);
    }

    .mode-icon-svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    .mode-icon-base {
      fill: none;
      stroke: var(--mode-edge);
      stroke-width: 2.5;
      vector-effect: non-scaling-stroke;
    }

    .mode-icon-side {
      stroke: transparent;
      stroke-width: 2.5;
      stroke-linecap: square;
      vector-effect: non-scaling-stroke;
    }

    .mode-all .mode-icon-base {
      stroke: var(--mode-accent);
    }

    .mode-vertical .mode-icon-top,
    .mode-vertical .mode-icon-bottom {
      stroke: var(--mode-accent);
    }

    .mode-horizontal .mode-icon-left,
    .mode-horizontal .mode-icon-right {
      stroke: var(--mode-accent);
    }

    .mode-top .mode-icon-top {
      stroke: var(--mode-accent);
    }

    .mode-right .mode-icon-right {
      stroke: var(--mode-accent);
    }

    .mode-bottom .mode-icon-bottom {
      stroke: var(--mode-accent);
    }

    .mode-left .mode-icon-left {
      stroke: var(--mode-accent);
    }

    .field-row {
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .input-section {
      display: grid;
      gap: 6px;
    }

    .field-row-pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .field-row input {
      width: 100%;
      border: 1px solid var(--mode-border);
      border-radius: 4px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      padding: 6px 8px;
      box-sizing: border-box;
      background: var(--bg-secondary);
      color: var(--text-primary);
      transition: border-color 120ms ease;
    }

    .field-row input::placeholder {
      color: var(--text-tertiary);
    }

    .field-row input:hover {
      border-color: #555555;
    }

    .field-row input:focus,
    .field-row input:focus-visible {
      border-color: var(--mode-accent);
      outline: none;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .check-row label {
      font-size: 12px;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .check-row input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      border: 1px solid #555555;
      border-radius: 3px;
      background: var(--bg-secondary);
      display: grid;
      place-content: center;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    .check-row input[type="checkbox"]:hover {
      border-color: #6b6b6b;
    }

    .check-row input[type="checkbox"]:checked {
      background: var(--mode-accent);
      border-color: var(--mode-accent);
    }

    .check-row input[type="checkbox"]:checked::after {
      content: "";
      width: 4px;
      height: 7px;
      border: solid #ffffff;
      border-width: 0 1.75px 1.75px 0;
      transform: translateY(-0.5px) rotate(45deg);
    }

    .check-row input[type="checkbox"]:focus-visible {
      outline: 2px solid var(--mode-accent-hover);
      outline-offset: 1px;
    }

    .check-section {
      display: grid;
      gap: 6px;
    }

    .selection {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-tertiary);
      transition: color 120ms ease;
    }

    .selection.has-selection {
      color: var(--text-secondary);
    }

    button.primary {
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      padding: 9px 10px;
      width: 100%;
      background: var(--mode-accent);
      color: #ffffff;
      cursor: pointer;
      transition: background-color 120ms ease;
    }

    button.primary:hover {
      background: var(--mode-accent-hover);
    }

    button.primary:active {
      background: var(--mode-accent-active);
    }

    button.primary:focus-visible {
      outline: 2px solid var(--mode-accent-hover);
      outline-offset: 1px;
    }
  </style>
</head>
<body>
  <div class="mode-section">
    <div id="mode-title" class="mode-title">Mode All Side</div>
    <div id="mode-grid" class="mode-grid" role="radiogroup" aria-labelledby="mode-title"></div>
  </div>

  <div class="input-section">
    <div class="mode-title">Spacing</div>
    <div class="field-row-pair">
      <div class="field-row">
        <label for="padding">Padding (px)</label>
        <input id="padding" type="number" inputmode="decimal" min="0" step="1" placeholder="0" />
      </div>
      <div class="field-row">
        <label for="gap">Gap (px)</label>
        <input id="gap" type="number" inputmode="decimal" min="0" step="1" placeholder="0" />
      </div>
    </div>
  </div>

  <div class="check-section">
    <div class="mode-title">Remove</div>
    <div class="check-row">
      <label for="remove-last-gap">
        <input id="remove-last-gap" type="checkbox" />
        Set gap between the last two items
      </label>
    </div>
  </div>

  <div id="selection" class="selection" aria-live="polite">0 Frames Selected</div>

  <button id="apply" type="button" class="primary">Resize</button>

  <script>
    const MODE_OPTIONS = [
      { value: 'all', label: 'All sides', title: 'All Side' },
      { value: 'vertical', label: 'Top and Bottom' },
      { value: 'horizontal', label: 'Left and Right' },
      { value: 'top', label: 'Top' },
      { value: 'right', label: 'Right' },
      { value: 'bottom', label: 'Bottom' },
      { value: 'left', label: 'Left' }
    ];
    const MODE_MAP = new Map(MODE_OPTIONS.map((option) => [option.value, option]));
    const MODE_ICON = [
      '<svg class="mode-icon-svg" viewBox="0 0 18 18" aria-hidden="true">',
      '<rect class="mode-icon-base" x="2.5" y="2.5" width="13" height="13"></rect>',
      '<line class="mode-icon-side mode-icon-top" x1="2.5" y1="2.5" x2="15.5" y2="2.5"></line>',
      '<line class="mode-icon-side mode-icon-right" x1="15.5" y1="2.5" x2="15.5" y2="15.5"></line>',
      '<line class="mode-icon-side mode-icon-bottom" x1="2.5" y1="15.5" x2="15.5" y2="15.5"></line>',
      '<line class="mode-icon-side mode-icon-left" x1="2.5" y1="2.5" x2="2.5" y2="15.5"></line>',
      '</svg>'
    ].join('');

    const modeGridEl = document.getElementById('mode-grid');
    const modeTitleEl = document.getElementById('mode-title');
    const selectionEl = document.getElementById('selection');
    const paddingInput = document.getElementById('padding');
    const gapInput = document.getElementById('gap');
    const removeLastGapInput = document.getElementById('remove-last-gap');
    const applyButton = document.getElementById('apply');

    const modeInputs = new Map();
    const saveTimers = new Map();
    const INPUT_SAVE_DEBOUNCE_MS = 150;
    const BLOCKED_NUMBER_KEYS = new Set(['-', '+', 'e', 'E']);

    let uiSizeRaf = 0;
    let currentMode = 'all';
    let lastPostedHeight = 0;

    function postToPlugin(pluginMessage) {
      parent.postMessage({ pluginMessage }, '*');
    }

    function postUiSizeNow() {
      const body = document.body;
      const height = Math.ceil(Math.max(body.offsetHeight, body.getBoundingClientRect().height));
      if (height === lastPostedHeight) return;
      lastPostedHeight = height;
      postToPlugin({ type: 'ui-size', height });
    }

    function requestUiSize() {
      if (uiSizeRaf !== 0) return;
      uiSizeRaf = requestAnimationFrame(() => {
        uiSizeRaf = 0;
        postUiSizeNow();
      });
    }

    function sanitizeNonNegativeValue(rawValue) {
      const raw = Number(rawValue);
      return Number.isFinite(raw) ? Math.max(0, raw) : 0;
    }

    function formatNumberInputValue(value) {
      const safeValue = sanitizeNonNegativeValue(value ?? 0);
      return safeValue === 0 ? '' : String(safeValue);
    }

    function setMode(mode) {
      currentMode = MODE_MAP.has(mode) ? mode : 'all';
      const selected = modeInputs.get(currentMode);
      if (selected) selected.checked = true;
      const option = MODE_MAP.get(currentMode);
      modeTitleEl.textContent = `Mode ${option.title || option.label}`;
    }

    function saveSetting(type, field, value) {
      const existingTimer = saveTimers.get(type);
      if (existingTimer) {
        clearTimeout(existingTimer);
        saveTimers.delete(type);
      }
      postToPlugin({ type, [field]: value });
    }

    function saveSettingDebounced(type, field, getValue) {
      const existingTimer = saveTimers.get(type);
      if (existingTimer) clearTimeout(existingTimer);
      saveTimers.set(
        type,
        setTimeout(() => {
          saveTimers.delete(type);
          postToPlugin({ type, [field]: getValue() });
        }, INPUT_SAVE_DEBOUNCE_MS)
      );
    }

    function triggerResize() {
      for (const timer of saveTimers.values()) clearTimeout(timer);
      saveTimers.clear();
      postToPlugin({
        type: 'resize',
        mode: currentMode,
        padding: sanitizeNonNegativeValue(paddingInput.value),
        gap: sanitizeNonNegativeValue(gapInput.value),
        removeLastGap: removeLastGapInput.checked
      });
    }

    function setupNumberInput(input, saveType, field) {
      let justFocused = false;

      input.addEventListener('focus', () => {
        justFocused = true;
        try {
          input.select();
        } catch (_error) {
          // Ignore environments where selecting is not supported.
        }
      });

      input.addEventListener('mouseup', (event) => {
        if (!justFocused) return;
        justFocused = false;
        event.preventDefault();
      });

      input.addEventListener('input', () => {
        saveSettingDebounced(saveType, field, () => sanitizeNonNegativeValue(input.value));
      });

      input.addEventListener('blur', () => {
        justFocused = false;
        if (input.value.trim() === '') {
          if (input.validity && !input.validity.valid) input.value = '';
          saveSetting(saveType, field, 0);
          return;
        }
        const safeValue = sanitizeNonNegativeValue(input.value);
        input.value = safeValue === 0 ? '' : String(safeValue);
        saveSetting(saveType, field, safeValue);
      });

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          triggerResize();
          return;
        }

        if (BLOCKED_NUMBER_KEYS.has(event.key)) {
          event.preventDefault();
          return;
        }

        if (event.shiftKey && (event.key === 'ArrowUp' || event.key === 'ArrowDown')) {
          event.preventDefault();
          const delta = event.key === 'ArrowUp' ? 10 : -10;
          const nextValue = Math.max(0, sanitizeNonNegativeValue(input.value) + delta);
          input.value = nextValue === 0 ? '' : String(nextValue);
          saveSetting(saveType, field, nextValue);
        }
      });
    }

    function renderModeOptions() {
      modeGridEl.innerHTML = MODE_OPTIONS.map((option) => [
        `<label class="mode-card mode-${option.value}" title="${option.label}">`,
        `<input type="radio" name="mode" value="${option.value}" ${option.value === currentMode ? 'checked' : ''} aria-label="${option.label}" />`,
        `<span>${MODE_ICON}</span>`,
        '</label>'
      ].join('')).join('');

      modeInputs.clear();
      for (const radio of modeGridEl.querySelectorAll('input[name="mode"]')) {
        modeInputs.set(radio.value, radio);
      }
    }

    renderModeOptions();
    setMode(currentMode);
    setupNumberInput(paddingInput, 'save-padding', 'padding');
    setupNumberInput(gapInput, 'save-gap', 'gap');

    modeGridEl.addEventListener('change', (event) => {
      const target = event.target;
      if (!target || target.name !== 'mode') return;
      setMode(target.value);
      saveSetting('save-mode', 'mode', currentMode);
    });

    removeLastGapInput.addEventListener('change', () => {
      saveSetting('save-remove-last-gap', 'removeLastGap', removeLastGapInput.checked);
    });

    applyButton.addEventListener('click', triggerResize);

    const messageHandlers = {
      'selection-info': (msg) => {
        const count = typeof msg.frameCount === 'number' ? msg.frameCount : 0;
        selectionEl.textContent = `${count} Frame${count === 1 ? '' : 's'} Selected`;
        selectionEl.classList.toggle('has-selection', count > 0);
      },
      'set-mode': (msg) => {
        setMode(msg.mode);
      },
      'set-padding': (msg) => {
        paddingInput.value = formatNumberInputValue(msg.padding);
      },
      'set-gap': (msg) => {
        gapInput.value = formatNumberInputValue(msg.gap);
      },
      'set-remove-last-gap': (msg) => {
        removeLastGapInput.checked = msg.removeLastGap === true;
      }
    };

    window.addEventListener('message', (event) => {
      const msg = event.data && event.data.pluginMessage;
      if (!msg || typeof msg !== 'object') return;

      const handler = messageHandlers[msg.type];
      if (!handler) return;
      handler(msg);
    });

    postToPlugin({ type: 'ui-ready' });
    requestUiSize();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(requestUiSize);
    }
    window.addEventListener('resize', requestUiSize);
  </script>
</body>
</html>
